<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماشین حساب</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .calculator {
      background: #1e1e2f;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                  0 0 0 1px rgba(255, 255, 255, 0.05);
      width: 100%;
      max-width: 360px;
      padding: 24px;
      overflow: hidden;
    }

    .display {
      background: #0d0d1a;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      text-align: left;
      direction: ltr;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .expression {
      color: #8b8b9e;
      font-size: 18px;
      min-height: 24px;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .result {
      color: #ffffff;
      font-size: 42px;
      font-weight: 600;
      word-break: break-all;
      line-height: 1.1;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 500;
      height: 64px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #ffffff;
      user-select: none;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-number {
      background: #2a2a40;
    }

    .btn-number:hover {
      background: #353550;
    }

    .btn-operator {
      background: #3d3d5c;
      color: #a78bfa;
    }

    .btn-operator:hover {
      background: #4a4a6e;
    }

    .btn-function {
      background: #2a2a40;
      color: #94a3b8;
      font-size: 18px;
    }

    .btn-function:hover {
      background: #353550;
    }

    .btn-equals {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      grid-column: span 2;
    }

    .btn-equals:hover {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
    }

    .btn-zero {
      grid-column: span 2;
    }

    .btn-clear {
      background: #ef4444;
      color: white;
    }

    .btn-clear:hover {
      background: #dc2626;
    }

    .btn-backspace {
      background: #f59e0b;
      color: white;
    }

    .btn-backspace:hover {
      background: #d97706;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">C</button>
      <button class="btn-backspace" onclick="backspace()">⌫</button>
      <button class="btn-function" onclick="percent()">%</button>
      <button class="btn-operator" onclick="appendOperator('/')">÷</button>

      <button class="btn-number" onclick="appendNumber('7')">7</button>
      <button class="btn-number" onclick="appendNumber('8')">8</button>
      <button class="btn-number" onclick="appendNumber('9')">9</button>
      <button class="btn-operator" onclick="appendOperator('*')">×</button>

      <button class="btn-number" onclick="appendNumber('4')">4</button>
      <button class="btn-number" onclick="appendNumber('5')">5</button>
      <button class="btn-number" onclick="appendNumber('6')">6</button>
      <button class="btn-operator" onclick="appendOperator('-')">−</button>

      <button class="btn-number" onclick="appendNumber('1')">1</button>
      <button class="btn-number" onclick="appendNumber('2')">2</button>
      <button class="btn-number" onclick="appendNumber('3')">3</button>
      <button class="btn-operator" onclick="appendOperator('+')">+</button>

      <button class="btn-number btn-zero" onclick="appendNumber('0')">0</button>
      <button class="btn-number" onclick="appendDecimal()">.</button>
      <button class="btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentExpression = '';
    let justCalculated = false;

    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');

    function updateDisplay() {
      expressionEl.textContent = currentExpression;
      if (currentExpression === '') {
        resultEl.textContent = '0';
      } else {
        try {
          // نمایش نتیجه موقت
          const preview = evaluate(currentExpression);
          if (preview !== null && !isNaN(preview)) {
            resultEl.textContent = formatNumber(preview);
          } else {
            resultEl.textContent = currentExpression;
          }
        } catch {
          resultEl.textContent = currentExpression;
        }
      }
    }

    function formatNumber(num) {
      if (Number.isInteger(num)) return num.toString();
      return parseFloat(num.toFixed(10)).toString();
    }

    function evaluate(expr) {
      // تبدیل علائم برای eval
      let safeExpr = expr
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-');

      // جلوگیری از عبارت ناقص
      if (/[+\-*/]$/.test(safeExpr)) {
        safeExpr = safeExpr.slice(0, -1);
      }

      if (!safeExpr) return null;

      try {
        // استفاده از Function به جای eval برای امنیت بیشتر
        const result = Function('"use strict"; return (' + safeExpr + ')')();
        return result;
      } catch {
        return null;
      }
    }

    function appendNumber(num) {
      if (justCalculated) {
        currentExpression = '';
        justCalculated = false;
      }
      currentExpression += num;
      updateDisplay();
    }

    function appendOperator(op) {
      if (currentExpression === '' && op !== '-') return;

      justCalculated = false;

      // اگر آخرین کاراکتر عملگر بود، جایگزین کن
      if (/[+\-*/×÷−]$/.test(currentExpression)) {
        currentExpression = currentExpression.slice(0, -1) + op;
      } else {
        currentExpression += op;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (justCalculated) {
        currentExpression = '0';
        justCalculated = false;
      }

      // پیدا کردن آخرین عدد
      const parts = currentExpression.split(/[+\-*/×÷−]/);
      const lastPart = parts[parts.length - 1];

      if (!lastPart.includes('.')) {
        if (lastPart === '' || /[+\-*/×÷−]$/.test(currentExpression)) {
          currentExpression += '0.';
        } else {
          currentExpression += '.';
        }
        updateDisplay();
      }
    }

    function clearAll() {
      currentExpression = '';
      justCalculated = false;
      updateDisplay();
    }

    function backspace() {
      if (justCalculated) {
        currentExpression = '';
        justCalculated = false;
      } else {
        currentExpression = currentExpression.slice(0, -1);
      }
      updateDisplay();
    }

    function percent() {
      if (currentExpression === '') return;

      try {
        const value = evaluate(currentExpression);
        if (value !== null) {
          currentExpression = formatNumber(value / 100);
          justCalculated = true;
          updateDisplay();
        }
      } catch {}
    }

    function calculate() {
      if (currentExpression === '') return;

      try {
        const result = evaluate(currentExpression);
        if (result !== null && !isNaN(result) && isFinite(result)) {
          expressionEl.textContent = currentExpression + ' =';
          resultEl.textContent = formatNumber(result);
          currentExpression = formatNumber(result);
          justCalculated = true;
        } else {
          resultEl.textContent = 'خطا';
        }
      } catch {
        resultEl.textContent = 'خطا';
      }
    }

    // پشتیبانی از کیبورد
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        appendNumber(e.key);
      } else if (e.key === '.') {
        appendDecimal();
      } else if (e.key === '+' || e.key === '-') {
        appendOperator(e.key);
      } else if (e.key === '*') {
        appendOperator('*');
      } else if (e.key === '/') {
        e.preventDefault();
        appendOperator('/');
      } else if (e.key === 'Enter' || e.key === '=') {
        calculate();
      } else if (e.key === 'Backspace') {
        backspace();
      } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        clearAll();
      } else if (e.key === '%') {
        percent();
      }
    });

    // مقدار اولیه
    updateDisplay();
  </script>
</body>
</html>
